[package]
name = "jito-sdk-rust"
version = "0.4.3"
authors = ["mdr0id <marshall@jito.wtf>"]
edition = "2021"

description = "Rust SDK for interacting with Jito RPC services on Solana"
license = "MIT"
repository = "https://github.com/jito-labs/jito-rust-rpc"
homepage = "https://www.jito.wtf/"
keywords = ["solana", "rpc", "jito", "blockchain", "sdk"]

[features]
use-solana-types = ["dep:solana-transaction"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
anyhow = "1.0"
serde = "1.0.209"
bincode = "1.3.3"
bs58 = "0.4.0"
base64 = "0.22"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
solana-transaction = { version = "~3.0", features = ["serde"], default-features = false, optional = true }

# Individual Solana crates - ONLY for examples
[dev-dependencies]
solana-keypair = { version = "~3.0", default-features = false }
solana-pubkey = { version = "~3.0", default-features = false }
solana-transaction = { version = "~3.0", default-features = false }
solana-compute-budget-interface = "~3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-rpc-client = { version = "~3.0", default-features = false }
solana-rpc-client-api = { version = "~3.0" }
